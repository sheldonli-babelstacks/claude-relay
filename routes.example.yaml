# claude-relay 路由配置示例。复制成 routes.yaml，把占位符换成你自己的。
# 密钥只能用 ${ENV_VAR_NAME} 引用环境变量，不要直接写在这里——这个文件本身可能被提交进仓库。

state_dir: /var/lib/claude-relay

github_webhook_secret: "${GITHUB_WEBHOOK_SECRET}"
jira_webhook_secret: "${JIRA_WEBHOOK_SECRET}"

accounts:
  a:
    config_dir: /var/lib/claude-relay/accounts/a
  b:
    config_dir: /var/lib/claude-relay/accounts/b

# 防回环：relay 唤醒出来的会话，自己又去评论触发新事件——不挡住会死循环。
#
# 首行「角色｜姓名」（如 "高级经理｜Morgan：..." 或单独一行 "高级经理｜Morgan"）的评论，
# 一律不触发任何唤醒——这是硬规则，写死在 relay/antiloop.py + relay/roster.py 里，不是
# 靠下面 ignore_body_patterns 配置出来的，所以这里不用再配。背景（GUJI-195 10691）：
# Jira 里我们所有会话共用同一个账号，按 author 过滤完全无效，只能认这个首行约定；
# 之前只匹配"整行恰好是角色｜姓名"，真实评论首行后面常跟冒号加正文，漏判导致 Morgan
# 评论里提到自己名字时唤醒了自己，现已改成前缀匹配并挪进代码里强制生效。
# 代价：role｜name 首行的评论即使想 @ 别人也不会触发唤醒了——这类会话间的主动叫醒，
# 改用 wake-sessions 的 create_trigger／fire_trigger，不再依赖这条 webhook 路径。
anti_loop:
  ignore_authors:
    - "<relay 自己账号在 Jira/GitHub 上的 accountId 或 login，占位符>"
  ignore_body_patterns:
    - "Generated by Claude Code"
  circuit_breaker:
    window_seconds: 300
    max_wakes: 20   # 5 分钟内全局唤醒数超过这个数就全局熔断，需要人工恢复（reset_circuit_breaker 才能恢复，不自动恢复）

dedup:
  window_seconds: 86400
  db_path: /var/lib/claude-relay/dedup.sqlite3

routes:
  - name: jira-comment-mentions-manager
    source: jira
    event: comment_created
    match:
      issue_prefix: "PROJ-"
      author_allowlist:
        - "<只响应这个 accountId 的评论，占位符>"
      body_contains: "@经理"
    action:
      type: wake
      account: a
      session_id: "<目标会话 session_id，占位符>"
    template:
      fields: ["issue_key", "author_display_name", "event", "issue_url"]
      max_body_chars: 0   # 0 = 默认不带评论正文，让目标会话自己去卡上读；>0 会截断并标「外部来源」
      prefix: "[claude-relay] Jira 评论提到了你"
    rate:
      per_hour: 20

  - name: github-push-to-eng
    source: github
    event: push
    match:
      repo: "<org/repo 占位符>"
      ref: "refs/heads/main"
    action:
      type: wake
      account: a
      session_id: "<目标会话 session_id，占位符>"
    template:
      fields: ["repo", "ref", "author_display_name", "url"]
      prefix: "[claude-relay] 有新推送"
    rate:
      per_hour: 20
    merge:
      enabled: true
      window_seconds: 45   # 短时间内多次 push 合并成一条，不刷屏

  - name: jira-comment-mention-roster
    # 不用给每个人单独写一条路由：正文里出现 "@某人"，且这个名字在花名册 JSON
    # 里有记录，就唤醒对应会话；一条评论 @ 多个人会分别唤醒。见 roster.example.json。
    #
    # 故意不配 rate.per_hour：这条路由是全组织共用的（所有人、所有卡都走它），
    # 人数一多很容易比静态路由快得多地跑满一个按路由算的限流，而且限流丢弃不
    # 进死信、不重试——一条真实消息可能就这样被默默丢了（实测踩过，20/小时在
    # 几十人规模、>200 条/小时的真实流量下几分钟就打满）。这类"一条路由服务所有人"
    # 的场景，建议只靠下面全局的 anti_loop.circuit_breaker 兜底真回环，并把阈值
    # 设到比你的真实峰值流量留足倍数的余量，不要再加 per_hour。
    source: jira
    event: comment_created
    match:
      issue_prefix: "PROJ-"
    action:
      type: wake_mentioned
      roster_path: /var/lib/claude-relay/roster.json
    template:
      fields: ["issue_key", "author_display_name", "event", "issue_url"]
      max_body_chars: 0
      prefix: "[claude-relay] Jira 评论提到了你"

  - name: send-ad-hoc
    source: send
    action:
      type: wake
      account: a
      session_id: "<目标会话 session_id，占位符>"
      token: "${SEND_ADHOC_TOKEN}"   # POST /send/send-ad-hoc 时 Authorization: Bearer <token>
